.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in 1s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes bl{50%{opacity:0}}
