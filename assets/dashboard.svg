  </defs>
  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>
  <text x="45" y="55" font-family="Arial" font-size="15" letter-spacing="3" fill="#48DDB0">MY DEVELOPER JOURNEY</text>
  <text x="45" y="105" font-family="Arial" font-size="32" font-weight="bold" fill="#FFFFFF">GitHub Dashboard</text>
  <rect x="45" y="120" width="90" height="4" rx="2" fill="url(#accent)"/>
