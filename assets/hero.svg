<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090d"/><stop offset="1" stop-color="#1a1710"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#b8935a"/><stop offset="0.5" stop-color="#F5D6A0"/><stop offset="1" stop-color="#b8935a"/></linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#F5D6A0" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern>
<style>
.f{opacity:0;animation:fi 1.1s ease forwards}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.a{animation-delay:.2s}.b{animation-delay:.7s}.c{animation-delay:1.2s}
</style>
</defs>
<rect width="1200" height="280" rx="16" fill="url(#bg)"/>
<rect width="1200" height="280" rx="16" fill="url(#grid)"/>
<rect width="300" height="280" fill="url(#sweep)"><animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/></rect>
<g class="f a"><text x="600" y="95" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#fff">Rvehat Javed</text></g>
<rect x="540" y="115" width="0" height="3" fill="url(#gold)"><animate attributeName="width" values="0;120" dur="1s" begin="0.7s" fill="freeze"/></rect>
<g class="f b"><text x="600" y="168" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" letter-spacing="6" fill="#F5D6A0">FULL STACK DEVELOPER</text></g>
<g class="f c"><text x="600" y="215" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#9aa3b2">Django  |  Python  |  Flutter  |  JavaScript</text></g>
</svg>
